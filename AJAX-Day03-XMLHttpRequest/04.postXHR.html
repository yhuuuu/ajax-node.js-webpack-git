<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLHttpRequest_数据提交</title>
</head>

<body>
    <button class="reg-btn">注册用户</button>
    <script>
        /**
         * 目标：使用xhr进行数据提交-完成注册功能
        */
        document.querySelector('.reg-btn').addEventListener('click', () => {
            const xhr = new XMLHttpRequest()
            xhr.open('POST', 'http://hmajax.itheima.net/api/register')
            xhr.addEventListener('loadend', () => {
                console.log(xhr.response)
            })

            // 设置请求头-告诉服务器内容类型（JSON字符串）
            //"Hey server, the body of this request is in JSON format."


            /**
             * Header Name	What it does
                Content-Type	
                Tells the server the type of request body (e.g. 
                application/json, 

                application/x-www-form-urlencoded, for -> Simple key-value pairs (like login)(const body = `username=cooper&password=123456`)
                
                multipart/form-data) for -> File uploads + text
                (const fd = new FormData()
                fd.append('username', 'cooper')
                fd.append('avatar', fileInput.files[0]))
               
                Accept	
                Tells the server what response format is expected (e.g. application/json)
                
                Authorization	
                Used to send tokens or credentials (e.g. Bearer xyz123)
               
                X-Requested-With	
                Often set to XMLHttpRequest to identify AJAX requests
                User-Agent	Tells the server what client/browser is making the request
             * 
             */
            xhr.setRequestHeader('Content-Type', 'application/json')
            // 准备提交的数据
            const userObj = {
                username: 'itheima007',
                password: '7654321'
            }
            //Obj->JSON
            const userStr = JSON.stringify(userObj)
            // 设置请求体，发起请求
            xhr.send(userStr)
        })
    </script>
</body>

</html>
